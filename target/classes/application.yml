server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application.name: linkly
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/linkly}
    username: ${DATABASE_USER:linkly}
    password: ${DATABASE_PASSWORD:linkly}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  jackson.serialization.write-dates-as-timestamps: false
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION_MS:3600000}
  public-base-url: ${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  cache.type: ${CACHE_TYPE:caffeine}
  rate-limit:
    max-requests: ${CREATE_RATE_LIMIT:20}
    window-seconds: ${CREATE_RATE_WINDOW_SECONDS:60}
springdoc.swagger-ui.path: /swagger-ui.html
